onboarding = false

[terminal]
default_shell = "/bin/zsh"

[session]
resume_agents_on_restore = true

[advanced]
scrollback_limit_bytes = 10000000

[ui]
mouse_capture = true
copy_on_select = true
redraw_on_focus_gained = false  # suspected cause of constant redraw flicker over SSH: repeated focus events each force a full repaint
confirm_close = true
pane_scrollbars = true
pane_gaps = true
pane_borders = "always"

status_indicators = "dots"
[keys]
prefix = "ctrl+a"
edit_scrollback = "prefix+shift+e"  # moved off herdr's default (prefix+e), which is now the nvim sidebar toggle below
reload_config = "prefix+shift+r"  # moved off prefix+r to make room for Pickr's tabs-space picker below
split_vertical = "prefix+|"     # side-by-side, like tmux's `bind |`
split_horizontal = "prefix+\""  # stacked, like tmux's `bind '"'`
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
next_tab = "prefix+ctrl+l"
previous_tab = "prefix+ctrl+h"
move_tab_previous = "prefix+alt+shift+left"  # reorder tabs; unbound by default
move_tab_next = "prefix+alt+shift+right"
workspace_picker = "prefix+n"  # moved off herdr's default (prefix+w), which is now the tmux-style navigator below
copy_mode = "prefix+v"  # tmux.conf's `bind Escape copy-mode` doesn't translate
                        # (herdr reserves Escape to cancel the prefix sequence),
                        # so using v for "visual" instead
rename_pane = "prefix+t"
rename_tab = "prefix+,"  # tmux's default rename-window binding
detach = "prefix+d"
zoom = "prefix+shift+m"  # moved off herdr's default (prefix+z), matching tmux's `bind M`

# lazygit popup (overrides herdr's native `goto` default on prefix+g -- exact
# behavior of `goto` wasn't clear from docs/binary, low-impact tradeoff for the
# git mnemonic)
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "Lazygit"
width = "95%"
height = "95%"

# javoscript.herdr-pickr bindings
[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "javoscript.herdr-pickr.tabs-space"
description = "pick tabs in current space"

[[keys.command]]
key = "prefix+shift+t"
type = "plugin_action"
command = "javoscript.herdr-pickr.tabs-all"
description = "pick tabs in all spaces"

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "javoscript.herdr-pickr.spaces"
description = "pick spaces"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "javoscript.herdr-pickr.agents-space"
description = "pick agents in current space"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "javoscript.herdr-pickr.agents-all"
description = "pick agents in all spaces"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "javoscript.herdr-pickr.panes-tab"
description = "pick panes in this tab"

# chmarax.herdr-nvim bindings
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# caneppelevitor.herdr-tmux-session-navigator bindings
[[keys.command]]
key = "prefix+w"
type = "plugin_action"
command = "vitor.tmux-session-navigator.open"
description = "tmux-style workspace/session navigator"

[theme]
name = "one-dark"

[theme.custom]
accent = "#61afef"
panel_bg = "#282c34"
sidebar_bg = "#181a1f"
active_row_bg = "#323844"
selection_bg = "#323844"
surface0 = "#2c313c"
surface1 = "#323844"
surface_dim = "#21252b"
overlay0 = "#5c6370"
overlay1 = "#767676"
text = "#abb2bf"
subtext0 = "#5c6370"
mauve = "#c678dd"
green = "#98c379"
yellow = "#e5c07b"
red = "#e86671"
blue = "#61afef"
teal = "#56b6c2"
peach = "#e5c07b"
